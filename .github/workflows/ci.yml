name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: Lint + TypeScript + Build ──────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript + compile)
        run: npm run build

  # ── Backend: Unit Tests ─────────────────────────────────────
  backend-unit:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate .env.test
        run: |
          JWT_ACCESS=$(openssl rand -hex 32)
          JWT_REFRESH=$(openssl rand -hex 32)
          CRON=$(openssl rand -hex 32)
          printf '%s\n' \
            "NODE_ENV=test" \
            "DATABASE_URL=postgresql://postgres:postgres@localhost:5434/ys_matrix_test" \
            "JWT_ACCESS_SECRET=$JWT_ACCESS" \
            "JWT_REFRESH_SECRET=$JWT_REFRESH" \
            "JWT_ACCESS_EXPIRES=15m" \
            "JWT_REFRESH_EXPIRES=7d" \
            "CRON_SECRET=$CRON" \
            "BCRYPT_ROUNDS=4" \
            "API_VERSION=v1" \
            "PORT=0" \
            "SYSTEM_SHOWROOM_ID=sh-sys" \
            "RATE_LIMIT_SUPERADMIN_MAX=500" \
            "RATE_LIMIT_SENSITIVE_MAX=100" \
            "RATE_LIMIT_AUTH_MAX=200" \
            "RATE_LIMIT_FORGOT_MAX=100" \
            "RATE_LIMIT_REGISTER_MAX=100" \
            "RATE_LIMIT_MAX=10000" \
            "RATE_LIMIT_WINDOW_MS=60000" \
            "EMAIL_TRANSPORT=console" \
            "EMAIL_SIMULATE_FAILURE=false" \
            > .env.test

      - name: Prisma Generate
        run: npx prisma generate

      - name: Unit Tests
        run: npm test

  # ── Backend: Integration Tests (PostgreSQL) ─────────────────
  backend-integration:
    runs-on: ubuntu-latest
    needs: backend-unit
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ys_matrix_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Generate .env.test
        run: |
          JWT_ACCESS=$(openssl rand -hex 32)
          JWT_REFRESH=$(openssl rand -hex 32)
          CRON=$(openssl rand -hex 32)
          printf '%s\n' \
            "NODE_ENV=test" \
            "DATABASE_URL=postgresql://postgres:postgres@localhost:5434/ys_matrix_test" \
            "JWT_ACCESS_SECRET=$JWT_ACCESS" \
            "JWT_REFRESH_SECRET=$JWT_REFRESH" \
            "JWT_ACCESS_EXPIRES=15m" \
            "JWT_REFRESH_EXPIRES=7d" \
            "CRON_SECRET=$CRON" \
            "BCRYPT_ROUNDS=4" \
            "API_VERSION=v1" \
            "PORT=0" \
            "SYSTEM_SHOWROOM_ID=sh-sys" \
            "RATE_LIMIT_SUPERADMIN_MAX=500" \
            "RATE_LIMIT_SENSITIVE_MAX=100" \
            "RATE_LIMIT_AUTH_MAX=200" \
            "RATE_LIMIT_FORGOT_MAX=100" \
            "RATE_LIMIT_REGISTER_MAX=100" \
            "RATE_LIMIT_MAX=10000" \
            "RATE_LIMIT_WINDOW_MS=60000" \
            "EMAIL_TRANSPORT=console" \
            "EMAIL_SIMULATE_FAILURE=false" \
            > .env.test

      - name: Prisma Generate
        run: npx prisma generate

      - name: Prisma Migrate
        run: npx prisma migrate deploy

      - name: Integration Tests
        run: node --test --test-concurrency=1 "tests/integration/*.test.js"
